name: Build Firmware
on:
  workflow_dispatch:
  push:

jobs:
  load_conf:
    runs-on: ubuntu-22.04
    outputs:
      refs: ${{ steps.load_step.outputs.refs }}
      standalones: ${{ steps.load_step.outputs.standalones }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 推荐：升级到 v4

      - id: load_step
        name: Load Config
        run: | 
          python loadConf.py
          cat $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-22.04
    needs:
      - load_conf
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.load_conf.outputs.refs) }}
        standalone: ${{ fromJson(needs.load_conf.outputs.standalones) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 推荐：升级到 v4

      - name: Install dependencies
        run: |
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates build-essential \
            pkg-config libreadline-dev gcc-arm-none-eabi libnewlib-dev libbz2-dev libssl-dev

      - name: Build
        env:
          MATRIX_REF: ${{ matrix.ref }}
          MATRIX_STANDALONE: ${{ matrix.standalone }}
        run: |
          python build.py

      - name: Show checksum
        run: |
          python checksum.py

      - name: Upload firmware
        uses: actions/upload-artifact@v4  # 必须：升级到 v4 以修复报错
        with:
          # v4 版本默认不允许覆盖同名 artifact。
          # 由于你的 name 包含了 matrix 变量，且 matrix 组合是唯一的，
          # 所以这里不会冲突，可以直接运行。
          name: firmware_${{ matrix.ref }}_${{ matrix.standalone }}
          path: |
            artifacts/**/*.elf
            artifacts/**/*.s19
            artifacts/**/*.bin
            artifacts/**/*.txt
            artifacts/**/Makefile.platform
